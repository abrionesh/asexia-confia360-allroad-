    <script>
      // Defensive fix for environments (iframes/proxies/extensions) where window.fetch has only a getter
      (function() {
        try {
          var proto = window;
          var desc = Object.getOwnPropertyDescriptor(proto, 'fetch');
          if (!desc && Object.getPrototypeOf) {
            var p = Object.getPrototypeOf(proto);
            if (p) desc = Object.getOwnPropertyDescriptor(p, 'fetch');
            if (!desc && p && Object.getPrototypeOf) {
              var pp = Object.getPrototypeOf(p);
              if (pp) desc = Object.getOwnPropertyDescriptor(pp, 'fetch');
            }
          }
          if (desc && !desc.set) {
            var _fetch = window.fetch ? window.fetch.bind(window) : null;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _fetch;
              },
              set: function(fn) {
                _fetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
